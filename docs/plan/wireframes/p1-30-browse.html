<style>
  :root {
    --background: oklch(0.966 0.006 59.7);
    --foreground: oklch(0.247 0.007 48.4);
    --card: oklch(0.981 0.004 56.4);
    --primary: oklch(0.586 0.075 195.3);
    --primary-foreground: oklch(0.983 0.008 186.9);
    --secondary: oklch(0.855 0.023 151.6);
    --muted: oklch(0.921 0.008 73.7);
    --muted-foreground: oklch(0.511 0.011 62.4);
    --accent-soft: oklch(0.93 0.02 155);
    --accent-foreground: oklch(0.370 0.037 157.3);
    --border: oklch(0.857 0.012 71.9);
    --ring: oklch(0.668 0.073 195.5);
    --radius: 0.625rem;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: Figtree, system-ui, sans-serif; }
  a { color: inherit; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid color-mix(in oklch, var(--primary) 20%, transparent); }
  .logo { width: 36px; height: 36px; border-radius: 999px; background: var(--primary); }
  .avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 24px; margin: 0; }
  .sub { margin: 0; font-size: 14px; color: var(--muted-foreground); }
  .back { font-size: 14px; text-decoration: none; color: var(--muted-foreground); }

  /* Theme list: 2 columns on phones, 3 on desktop */
  .themes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 768px) { .themes { grid-template-columns: repeat(3, 1fr); } }
  .theme { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--radius); background: var(--card); box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent); text-decoration: none; }
  .theme:hover { background: var(--muted); }
  .theme:focus-visible { outline: 2px solid var(--ring); }
  .theme svg { width: 22px; height: 22px; color: var(--secondary); stroke: var(--accent-foreground); }
  .theme h3 { margin: 0; font-size: 15px; line-height: 1.3; }
  .theme .count { font-size: 12px; color: var(--muted-foreground); }
  .theme .desc { display: none; margin: 0; font-size: 13px; color: var(--muted-foreground); }
  @media (min-width: 640px) { .theme .desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } }

  /* Filter chips: one scrollable row, never wraps */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; align-items: center; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; text-decoration: none; border: 1px solid var(--border); background: var(--card); white-space: nowrap; }
  .chip[aria-current="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  .divider { flex: none; width: 1px; height: 20px; background: var(--border); }
  .clear { flex: none; font-size: 13px; color: var(--muted-foreground); white-space: nowrap; }

  .prompts { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 768px) { .prompts { grid-template-columns: repeat(2, 1fr); } }
  .prompt { text-align: left; display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: var(--radius); border: 0; background: var(--card); box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent); font: inherit; color: inherit; cursor: pointer; }
  .prompt:hover { box-shadow: 0 0 0 1px color-mix(in oklch, var(--primary) 40%, transparent); }
  .prompt p { margin: 0; font-size: 16px; line-height: 1.5; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-foreground); }
  .go { font-size: 14px; font-weight: 500; color: var(--primary); }

  .more { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0 24px; }
  .count-line { font-size: 13px; color: var(--muted-foreground); margin: 0; }
  .more a { width: 100%; max-width: 360px; text-align: center; padding: 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); text-decoration: none; font-weight: 500; font-size: 14px; }
  .empty { padding: 32px 16px; text-align: center; border-radius: var(--radius); background: var(--muted); }
  .empty p { margin: 0 0 8px; }
  .note { font-size: 12px; color: var(--muted-foreground); border-top: 1px dashed var(--border); padding-top: 12px; }
</style>

:["playful","practical"]},{"title":"Your space","text":"How do you like your own space to look and feel?","depth":"light","tags":["practical"]},{"title":"How you learn","text":"How do you learn best when you're picking up something new?","depth":"light","tags":["thoughtful"]},{"title":"Charming oddity","text":"What's a little oddity of yours that you secretly quite like?","depth":"light","tags":["playful"]},{"title":"Energy rhythm","text":"When in the day are you at your best, and when are you running on empty?","depth":"light","tags":["practical"]},{"title":"Guess my quirk","text":"Step into my shoes: which of my quirks would I defend to the end?","depth":"light","tags":["playful"]},{"title":"Coming down","text":"After a busy day, what do you need before you're ready to talk?","depth":"medium","tags":["practical"]},{"title":"Social battery","text":"How much socialising feels just right to you, and how do you know when you've hit your limit?","depth":"medium","tags":["practical"]},{"title":"Guess my battery","text":"Step into my shoes: how can you tell when I've had enough of being around people?","depth":"medium","tags":["practical"]},{"title":"Making decisions","text":"How do you like to make bigger decisions: quickly, slowly, alone, or by talking them through?","depth":"medium","tags":["thoughtful"]},{"title":"Comfort habits","text":"What comfort habit do you return to when things feel wobbly?","depth":"medium","tags":["thoughtful"]},{"title":"Taking it in","text":"How do you tend to take in big news, good or bad?","depth":"medium","tags":["thoughtful"]},{"title":"Time alone","text":"What does good time on your own look like for you?","depth":"medium","tags":["practical"]},{"title":"Planner or not","text":"How far ahead do you like to plan, and how do you feel about last-minute changes?","depth":"medium","tags":["practical"]},{"title":"Feelings pace","text":"How long do you usually need to work out how you feel about something?","depth":"medium","tags":["thoughtful"]},{"title":"Just for you","text":"What's something you do purely for yourself that you'd never give up?","depth":"medium","tags":["thoughtful"]},{"title":"No longer sorry","text":"What's something about you that you used to apologise for but don't any more?","depth":"deep","tags":["thoughtful"]},{"title":"Kept it anyway","text":"What's something people have tried to change about you that you've kept anyway?","depth":"deep","tags":["thoughtful"]},{"title":"Accepted as is","text":"When have you felt most accepted exactly as you are?","depth":"deep","tags":["romantic","thoughtful"]},{"title":"When upset","text":"When you're upset, what do you need, and what do you hope people won't take personally?","depth":"deep","tags":["thoughtful"]},{"title":"My lines","text":"What's a personal boundary that simply matters to you, about how you live your own life?","depth":"deep","tags":["thoughtful"]},{"title":"Seen and kept","text":"Which part of you would you most like me to never try to change?","depth":"deep","tags":["romantic","thoughtful"]}]}]
;
const TAGS = [
  ["playful", "Playful"], ["thoughtful", "Thoughtful"], ["romantic", "Romantic"],
  ["practical", "Practical"], ["nostalgic", "Nostalgic"], ["hopeful", "Hopeful"],
];
const DEPTHS = [["light", "Light"], ["medium", "Medium"], ["deep", "Deep"]];
const PAGE_SIZE = 6;
// Lucide names for the theme symbols (the app maps the same keys in THEME_ICONS).
const ICONS = { coffee: "coffee", compass: "compass", house: "house", "calendar-heart": "calendar-heart",
  "message-circle-heart": "message-circle-heart", "hand-heart": "hand-heart", feather: "feather",
  fingerprint: "fingerprint", "heart-handshake": "heart-handshake" };

/** Mirrors the planned lib/prompt-filters.ts: the URL (here the hash) is the only state. */
function readFilters(params) {
  const depth = DEPTHS.some(([d]) => d === params.get("depth")) ? params.get("depth") : null;
  const tags = params.getAll("tag").filter((t) => TAGS.some(([s]) => s === t));
  const show = Math.max(PAGE_SIZE, Number(params.get("show")) || PAGE_SIZE);
  return { depth, tags, show };
}
function href(slug, f) {
  const p = new URLSearchParams();
  if (f.depth) p.set("depth", f.depth);
  f.tags.forEach((t) => p.append("tag", t));
  if (f.show > PAGE_SIZE) p.set("show", String(f.show));
  const q = p.toString();
  return `#/start/${slug}${q ? "?" + q : ""}`;
}
// Changing a filter resets "show"; depth is single choice, tags are any-of.
const toggleDepth = (f, d) => ({ depth: f.depth === d ? null : d, tags: f.tags, show: PAGE_SIZE });
const toggleTag = (f, t) => ({ depth: f.depth,
  tags: f.tags.includes(t) ? f.tags.filter((x) => x !== t) : [...f.tags, t], show: PAGE_SIZE });
const matches = (q, f) => (!f.depth || q.depth === f.depth) && (f.tags.length === 0 || q.tags.some((t) => f.tags.includes(t)));
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function themeList() {
  return `
    <h1>Choose a theme.</h1>
    <p class="sub">Pick a theme to get started with your conversation.</p>
    <div class="themes">
      ${CATALOGUE.map((t) => `
        <a class="theme" href="#/start/${t.slug}">
          <i data-lucide="${ICONS[t.symbol] ?? "sparkles"}"></i>
          <h3>${esc(t.title)}</h3>
          <p class="desc">${esc(t.description)}</p>
          <span class="count">${t.questions.length} questions</span>
        </a>`).join("")}
    </div>
    <p class="note">Wireframe · /start · 2 columns on phones, description hidden below 640px.</p>`;
}

function themePage(slug, params) {
  const theme = CATALOGUE.find((t) => t.slug === slug);
  if (!theme) return `<p>Theme not found. <a href="#/start">Back</a></p>`;
  const f = readFilters(params);
  const filtered = theme.questions.filter((q) => matches(q, f));
  const shown = filtered.slice(0, f.show);
  const any = f.depth || f.tags.length > 0;
  const clear = href(slug, { depth: null, tags: [], show: PAGE_SIZE });

  const chips = `
    <nav class="chips" aria-label="Filter questions">
      ${DEPTHS.map(([d, label]) => `<a class="chip" aria-current="${f.depth === d}" href="${href(slug, toggleDepth(f, d))}">${label}</a>`).join("")}
      <span class="divider" aria-hidden="true"></span>
      ${TAGS.map(([t, label]) => `<a class="chip" aria-current="${f.tags.includes(t)}" href="${href(slug, toggleTag(f, t))}">${label}</a>`).join("")}
      ${any ? `<a class="clear" href="${clear}">Clear</a>` : ""}
    </nav>`;

  const list = filtered.length === 0
    ? `<div class="empty"><p>No questions match these filters.</p><a href="${clear}">Clear filters</a></div>`
    : `<div class="prompts">
        ${shown.map((q) => `
          <button class="prompt" type="button" onclick="alert('Starts a conversation on: ' + ${esc(JSON.stringify(q.title))})">
            <p>${esc(q.text)}</p>
            <span class="meta"><span class="badge">${DEPTHS.find(([d]) => d === q.depth)[1]}</span><span class="go">Start this →</span></span>
          </button>`).join("")}
      </div>
      <div class="more">
        <p class="count-line">Showing ${shown.length} of ${filtered.length}</p>
        ${shown.length < filtered.length
          ? `<a href="${href(slug, { ...f, show: f.show + PAGE_SIZE })}" data-keep-scroll>Show ${Math.min(PAGE_SIZE, filtered.length - shown.length)} more</a>`
          : ""}
      </div>`;

  return `
    <a class="back" href="#/start">← All themes</a>
    <h1>${esc(theme.title)}</h1>
    <p class="sub">${esc(theme.description)}</p>
    ${chips}
    ${list}
    <p class="note">Wireframe · /start/${slug} · filters and "show" live in the URL, so back and refresh keep them.</p>`;
}

let keepScroll = false;
document.addEventListener("click", (e) => { if (e.target.closest("[data-keep-scroll], .chip, .clear")) keepScroll = true; });

function render() {
  const [path, query = ""] = location.hash.replace(/^#/, "").split("?");
  const m = path.match(/^\/start\/([a-z0-9-]+)$/);
  const y = window.scrollY;
  document.getElementById("app").innerHTML = m ? themePage(m[1], new URLSearchParams(query)) : themeList();
  lucide.createIcons();
  // Like Next's <Link scroll={false}>: Show more and chips don't jump to the top.
  window.scrollTo(0, keepScroll ? y : 0);
  keepScroll = false;
}
window.addEventListener("hashchange", render);
render();
</script>
